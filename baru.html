<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Pasar - Permintaan</title>
<style>
  :root{
    --teal:#1a5c56;
    --teal-dark:#0f3f3b;
    --cream:#f4f1e9;
    --line:#1a1a1a;
    --card-bg:#ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1c1c1a;
      --card-bg:#2a2a26;
      --line:#eee;
    }
  }
  :root[data-theme="dark"]{
    --cream:#1c1c1a;
    --card-bg:#2a2a26;
    --line:#eee;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--teal-dark);
    height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 28px;
  }
  header .logo{
    width:48px;height:48px;
    object-fit:contain;
    flex-shrink:0;
  }
  header .school-name{
    font-weight:700;
    font-size:clamp(14px,2vw,18px);
    color:var(--teal);
    letter-spacing:0.5px;
  }

  h1.title{
    text-align:center;
    font-size:clamp(32px,6vw,64px);
    font-weight:900;
    color:var(--teal);
    letter-spacing:2px;
    margin:0 0 30px 0;
  }

  .content{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:center;
    padding:0 28px 40px 28px;
    max-width:1400px;
    margin:0 auto;
  }

  .panel{
    flex:1 1 420px;
    min-width:320px;
    max-width:640px;
  }

  h2.panel-title{
    color:var(--teal);
    font-size:clamp(20px,3vw,32px);
    font-weight:900;
    margin:0 0 16px 0;
    text-transform:uppercase;
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card-bg);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  thead th{
    background:var(--teal);
    color:white;
    padding:14px 10px;
    font-size:clamp(13px,1.6vw,16px);
  }
  tbody td{
    border:1px solid #333;
    padding:0;
    text-align:center;
  }
  tbody input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    padding:16px 8px;
    font-size:16px;
    color:var(--line);
    font-family:inherit;
  }
  tbody input:focus{
    outline:2px solid var(--teal);
    outline-offset:-2px;
  }

  .row-controls{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .row-controls button{
    background:var(--teal);
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }
  .row-controls button:hover{
    background:var(--teal-dark);
  }
  .row-controls button.secondary{
    background:transparent;
    color:var(--teal);
    border:1.5px solid var(--teal);
  }

  .chart-wrap{
    background:var(--card-bg);
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    padding:10px;
    overflow-x:auto;
  }

  svg{
    width:100%;
    height:auto;
    display:block;
  }

  .axis-label{
    font-weight:700;
    font-size:14px;
    fill:var(--teal);
  }

  .hint{
    margin-top:10px;
    font-size:13px;
    color:#666;
    text-align:center;
  }

  footer{
    text-align:center;
    padding:20px;
    font-size:12px;
    color:#888;
  }
</style>
</head>

<script>
(function(){
  const tableBody = document.getElementById('tableBody');
  const addRowBtn = document.getElementById('addRow');
  const resetBtn = document.getElementById('resetBtn');
  const svg = document.getElementById('chart');

  const INITIAL_ROWS = 6;

  function createRow(price, qty){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="number" class="price-input" placeholder="" value="${price!==undefined?price:''}" min="0"></td>
      <td><input type="number" class="qty-input" placeholder="" value="${qty!==undefined?qty:''}" min="0"></td>
    `;
    tableBody.appendChild(tr);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', drawChart);
    });
  }

  function initRows(){
    tableBody.innerHTML = '';
    for(let i=0;i<INITIAL_ROWS;i++){
      createRow();
    }
  }

  addRowBtn.addEventListener('click', ()=>{
    createRow();
    drawChart();
  });

  resetBtn.addEventListener('click', ()=>{
    initRows();
    drawChart();
  });

  function getData(){
    const rows = tableBody.querySelectorAll('tr');
    const data = [];
    rows.forEach(row=>{
      const p = row.querySelector('.price-input').value;
      const q = row.querySelector('.qty-input').value;
      if(p !== '' && q !== '' && !isNaN(p) && !isNaN(q)){
        data.push({price: parseFloat(p), qty: parseFloat(q)});
      }
    });
    // sort by quantity ascending for a proper curve line
    data.sort((a,b)=>a.qty-b.qty);
    return data;
  }

  const W = 620, H = 520;
  const marginLeft = 80, marginBottom = 60, marginTop = 30, marginRight = 30;
  const plotW = W - marginLeft - marginRight;
  const plotH = H - marginTop - marginBottom;

  function drawChart(){
    const data = getData();
    svg.innerHTML = '';

    const ns = 'http://www.w3.org/2000/svg';

    function el(tag, attrs){
      const e = document.createElementNS(ns, tag);
      for(const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // determine scales
    let maxPrice = 10, maxQty = 10;
    if(data.length){
      maxPrice = Math.max(...data.map(d=>d.price));
      maxQty = Math.max(...data.map(d=>d.qty));
    }
    maxPrice = maxPrice <= 0 ? 10 : maxPrice * 1.2;
    maxQty = maxQty <= 0 ? 10 : maxQty * 1.2;

    function xPos(q){ return marginLeft + (q/maxQty) * plotW; }
    function yPos(p){ return marginTop + plotH - (p/maxPrice) * plotH; }

    // axes
    const axisColor = getComputedStyle(document.documentElement).getPropertyValue('--line') || '#1a1a1a';
    const teal = '#1a5c56';

    // Y axis
    svg.appendChild(el('line', {x1:marginLeft, y1:marginTop, x2:marginLeft, y2:marginTop+plotH, stroke:axisColor, 'stroke-width':2}));
    // X axis
    svg.appendChild(el('line', {x1:marginLeft, y1:marginTop+plotH, x2:marginLeft+plotW, y2:marginTop+plotH, stroke:axisColor, 'stroke-width':2}));

    // arrow heads
    svg.appendChild(el('polygon', {points:`${marginLeft-6},${marginTop+6} ${marginLeft+6},${marginTop+6} ${marginLeft},${marginTop-8}`, fill:axisColor}));
    svg.appendChild(el('polygon', {points:`${marginLeft+plotW-6},${marginTop+plotH-6} ${marginLeft+plotW-6},${marginTop+plotH+6} ${marginLeft+plotW+8},${marginTop+plotH}`, fill:axisColor}));

    // axis labels
    const yLabel = el('text', {x: marginLeft-10, y: marginTop-12, class:'axis-label', 'text-anchor':'end'});
    yLabel.textContent = 'Harga';
    svg.appendChild(yLabel);

    const xLabel = el('text', {x: marginLeft+plotW+20, y: marginTop+plotH+5, class:'axis-label', 'text-anchor':'start'});
    xLabel.textContent = 'Jumlah';
    svg.appendChild(xLabel);
    const xLabel2 = el('text', {x: marginLeft+plotW+20, y: marginTop+plotH+22, class:'axis-label', 'text-anchor':'start'});
    xLabel2.textContent = 'Diminta';
    svg.appendChild(xLabel2);

    // tick marks (5 divisions)
    const ticks = 5;
    for(let i=1;i<=ticks;i++){
      const py = marginTop + plotH - (i/ticks)*plotH;
      const val = Math.round((i/ticks)*maxPrice);
      svg.appendChild(el('line', {x1:marginLeft-5, y1:py, x2:marginLeft, y2:py, stroke:axisColor, 'stroke-width':1.5}));
      const t = el('text', {x:marginLeft-10, y:py+4, 'text-anchor':'end', 'font-size':'11', fill:axisColor});
      t.textContent = val;
      svg.appendChild(t);

      const px = marginLeft + (i/ticks)*plotW;
      const valx = Math.round((i/ticks)*maxQty);
      svg.appendChild(el('line', {x1:px, y1:marginTop+plotH, x2:px, y2:marginTop+plotH+5, stroke:axisColor, 'stroke-width':1.5}));
      const tx = el('text', {x:px, y:marginTop+plotH+18, 'text-anchor':'middle', 'font-size':'11', fill:axisColor});
      tx.textContent = valx;
      svg.appendChild(tx);
    }

    if(data.length === 0) return;

    // draw line connecting points
    if(data.length > 1){
      let pathD = '';
      data.forEach((d,i)=>{
        const x = xPos(d.qty), y = yPos(d.price);
        pathD += (i===0 ? 'M' : 'L') + x + ',' + y + ' ';
      });
      svg.appendChild(el('path', {d:pathD.trim(), fill:'none', stroke:teal, 'stroke-width':3}));
    }

    // draw points + labels
    data.forEach(d=>{
      const x = xPos(d.qty), y = yPos(d.price);
      svg.appendChild(el('circle', {cx:x, cy:y, r:6, fill:'#c0392b', stroke:'white', 'stroke-width':1.5}));
      const lbl = el('text', {x:x, y:y-12, 'text-anchor':'middle', 'font-size':'11', fill:teal, 'font-weight':'700'});
      lbl.textContent = `(${d.qty}, ${d.price})`;
      svg.appendChild(lbl);
    });
  }

  initRows();
  drawChart();
})();
</script>

</body>
</html>
